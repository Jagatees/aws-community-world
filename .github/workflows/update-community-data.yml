name: Update Community Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update-community-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Refresh AWS community data
        run: npm run update:community-data

      - name: Commit updated community data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/heroes.json src/data/community-builders.json src/data/community-builders-clusters.json src/data/community-builders-meta.json src/data/user-groups.json src/data/cloud-clubs.json scripts/.geo-cache.json
          git diff --staged --quiet || git commit -m "chore: refresh AWS community data"

      - name: Push changes
        run: git push
