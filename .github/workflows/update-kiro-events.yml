name: Update Kiro Events

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  update-kiro-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Kiro events
        run: npm run update:kiro-events

      - name: Commit updated Kiro events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/kiro-events.json scripts/.geo-cache.json
          git diff --staged --quiet || git commit -m "chore: refresh Kiro events"

      - name: Push changes
        run: git push
